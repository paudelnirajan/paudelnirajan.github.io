<head>

    <title>Writing — Nirajan Paudel</title>
    <meta name="description" content="Notes and long-form writing by Nirajan Paudel on multilingual NLP, efficient inference, and machine learning systems.">

    <script>
        (function () {
            try {
                var saved = localStorage.getItem('np-theme');
                var theme = saved || 'light';
                document.documentElement.setAttribute('data-theme', theme);
            } catch (e) {
                document.documentElement.setAttribute('data-theme', 'light');
            }
        })();
    </script>

    <style>
        /* ---- reading progress ---- */
        .progress {
            position: fixed;
            top: 0; left: 0;
            height: 2px;
            width: 0;
            z-index: 200;
            background: linear-gradient(90deg, var(--accent), var(--gold));
            transition: width 90ms linear;
        }

        /* ---- article shell ---- */
        .article {
            width: 100%;
            max-width: 720px;
            margin: 0 auto;
            padding: clamp(36px, 6vw, 72px) clamp(20px, 5vw, 40px) 80px;
            position: relative;
            z-index: 1;
        }

        .article-back {
            display: inline-flex;
            align-items: center;
            gap: 9px;
            font-family: var(--mono);
            font-size: 0.68rem;
            letter-spacing: 0.11em;
            text-transform: uppercase;
            color: var(--subtle);
            margin-bottom: 44px;
            transition: color var(--t), gap var(--t);
        }
        .article-back:hover { color: var(--accent); gap: 14px; }
        .article-back i { font-size: 0.66rem; }

        .article-meta {
            display: flex;
            align-items: center;
            gap: 14px;
            font-family: var(--mono);
            font-size: 0.68rem;
            letter-spacing: 0.06em;
            color: var(--subtle);
            margin-bottom: 18px;
        }
        .article-meta span + span::before {
            content: '·';
            margin-right: 14px;
            color: var(--rule-strong);
        }

        .article-title {
            font-family: var(--serif);
            font-size: clamp(1.9rem, 5vw, 2.9rem);
            font-weight: 600;
            font-variation-settings: 'SOFT' 25, 'opsz' 144;
            letter-spacing: -0.028em;
            line-height: 1.09;
            margin-bottom: 20px;
        }

        .article-tags { display: flex; flex-wrap: wrap; gap: 6px; }
        .article-tags span {
            font-family: var(--mono);
            font-size: 0.63rem;
            padding: 3px 9px;
            border-radius: 3px;
            background: var(--paper-2);
            border: 1px solid var(--rule);
            color: var(--subtle);
        }

        .article-rule {
            border: none;
            height: 1px;
            background: var(--rule);
            margin: 40px 0;
        }

        /* ---- prose ---- */
        .prose { color: var(--muted); font-size: 1.03rem; line-height: 1.78; }
        .prose > * + * { margin-top: 1.35em; }

        .prose h1, .prose h2 {
            font-family: var(--serif);
            font-size: clamp(1.3rem, 3vw, 1.6rem);
            font-weight: 600;
            font-variation-settings: 'SOFT' 25, 'opsz' 60;
            letter-spacing: -0.02em;
            line-height: 1.22;
            color: var(--ink);
            margin-top: 2.4em;
            margin-bottom: 0.55em;
            padding-bottom: 0.3em;
            border-bottom: 1px solid var(--rule);
        }
        .prose h1:first-child, .prose h2:first-child { margin-top: 0; }

        .prose h3 {
            font-family: var(--serif);
            font-size: 1.16rem;
            font-weight: 600;
            font-variation-settings: 'SOFT' 25, 'opsz' 30;
            letter-spacing: -0.014em;
            color: var(--ink);
            margin-top: 2em;
            margin-bottom: 0.4em;
        }

        .prose h4 {
            font-family: var(--mono);
            font-size: 0.68rem;
            font-weight: 500;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--accent);
            margin-top: 1.9em;
            margin-bottom: 0.4em;
        }

        .prose strong { color: var(--ink); font-weight: 600; }
        .prose em { font-style: italic; }

        .prose ul, .prose ol { padding-left: 1.35em; }
        .prose ul { list-style: disc; }
        .prose ol { list-style: decimal; }
        .prose li::marker { color: var(--accent); }
        .prose li + li { margin-top: 0.4em; }
        .prose li strong { color: var(--ink); }

        .prose blockquote {
            border-left: 2px solid var(--accent);
            padding: 2px 0 2px 22px;
            margin: 1.9em 0;
            font-family: var(--serif);
            font-style: italic;
            font-size: 1.06rem;
            font-variation-settings: 'SOFT' 60, 'opsz' 24;
            color: var(--muted);
        }
        .prose blockquote p { margin: 0; }

        .prose code {
            font-family: var(--mono);
            font-size: 0.84em;
            background: var(--paper-2);
            border: 1px solid var(--rule);
            padding: 2px 6px;
            border-radius: 4px;
            color: var(--ink);
        }

        .prose pre {
            background: var(--paper-2);
            border: 1px solid var(--rule);
            border-radius: var(--r-sm);
            padding: 18px 20px;
            overflow-x: auto;
            margin: 1.5em 0;
        }
        .prose pre code { background: none; border: none; padding: 0; font-size: 0.8rem; line-height: 1.7; }

        .prose table {
            width: 100%;
            border-collapse: collapse;
            margin: 1.5em 0;
            font-size: 0.88rem;
            display: block;
            overflow-x: auto;
        }
        .prose th {
            font-family: var(--mono);
            font-size: 0.7rem;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            font-weight: 500;
            color: var(--subtle);
            border-bottom: 1.5px solid var(--rule-strong);
            padding: 9px 13px;
            text-align: left;
            white-space: nowrap;
        }
        .prose td {
            padding: 10px 13px;
            border-bottom: 1px solid var(--rule);
            vertical-align: top;
        }
        .prose tr:last-child td { border-bottom: none; }

        .prose hr { border: none; height: 1px; background: var(--rule); margin: 2.4em 0; }

        .prose img {
            width: 100%;
            border-radius: var(--r-sm);
            border: 1px solid var(--rule);
            background: var(--surface);
            margin: 1.6em 0;
        }

        /* ---- footer of the article ---- */
        .article-end {
            margin-top: 64px;
            padding-top: 28px;
            border-top: 1px solid var(--rule);
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            align-items: center;
            justify-content: space-between;
        }
        .article-end p {
            font-family: var(--mono);
            font-size: 0.68rem;
            letter-spacing: 0.05em;
            color: var(--subtle);
        }
        .article-end a {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            font-size: 0.82rem;
            font-weight: 500;
            border: 1px solid var(--rule);
            border-radius: 100px;
            color: var(--muted);
            transition: all var(--t);
        }
        .article-end a:hover { color: var(--accent); border-color: var(--accent); }

        /* ---- states ---- */
        .state { text-align: center; padding: 72px 20px; color: var(--muted); }
        .state i { font-size: 1.6rem; color: var(--subtle); display: block; margin-bottom: 16px; }
        .state h2 { font-family: var(--serif); font-size: 1.3rem; color: var(--ink); margin-bottom: 8px; }
        .state a { color: var(--accent); text-decoration: underline; text-underline-offset: 3px; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .state.loading i { animation: spin 1s linear infinite; }
    </style>
</head>
